# Yukari Gaps Beta for Horizon, built by its launcher: `horizon-launcher native-build`.
# Gaps to travel between. MIT licensed. The blocks and art are the content mod `yukari_gap`.
[mod]
id = "yukari_gap_native"
version = "0.9.0"

[compatibility]
horizon_revision = "af386c5e436c760be0d194599497834620d2db10"

[api]
path = "api"

[[injection]]
id = "gap-dizziness-camera"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_camera_shake"
helper = "dizziness.rs"
bindings = [
  {name="game",ty="&crate::game::Game<'_>",value="&*self"},
  {name="shake",ty="&mut crate::game::native_hooks::NativeShake",value="&mut *shake"}
]

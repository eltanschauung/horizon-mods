id = "yukari_gap_native"
name = "Yukari Gaps Beta"
version = "0.9.1+sdk.1"
description = "Teleport between gaps, with owner controls, dyeable bows and distance-based hunger costs."
authors = ["mxpbxb"]
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "71156c86c351fa42a77f616c8422412eaaae0760"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.mixin]]
id = "upgrade-legacy-gap-entity-type"
kind = "RETURN"
target = "horizon_client_lib::save::native_block_entity_type::read"
helper = "src/mixins/legacy_id.rs"
bindings = [{ name = "id", ty = "Option<String>", value = "$value" }]

[[native.mixin]]
id = "gap-client-ambient"
kind = "HEAD"
target = "horizon_client::game::render_tick::Game::tick_particle_spawns"
helper = "src/mixins/gap_ambient.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "self" }]

id = "horizon_old_combat_mod"
name = "Horizon Old Combat Mod"
version = "0.2.0"
description = "Use classic attack speed and preserve sprint after attack knockback."
authors = ["eltanschauung", "TheHangel (original mod)"]
api = "0.2"
side = "both"
capabilities = ["registries"]
license = "MIT"

[native]
game = "26.3"
horizon = "71156c86c351fa42a77f616c8422412eaaae0760"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.mixin]]
id = "preserve-sprint"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::enchant_effects::Game::stop_sprint_after_extra_knockback"
helper = "src/mixins/sprint.rs"
bindings = [{ name = "game", ty = "&crate::game::Game<'_>", value = "&*self" }]

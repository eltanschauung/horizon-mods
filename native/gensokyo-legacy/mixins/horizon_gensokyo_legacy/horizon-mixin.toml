[mod]
id = "horizon_gensokyo_legacy"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "e1ac8a85953b8c933841810acb6a6e3c1dcf7e84"

[[module]]
id = "features"
file = "crates/horizon-world/src/worldgen/feature_graph.rs"
name = "gensokyo"
visibility = "pub"
source = "features.rs"

[[module]]
id = "placements"
file = "crates/horizon-world/src/worldgen/placement.rs"
name = "gensokyo"
source = "placements.rs"

[[module]]
id = "bamboo-grove"
file = "crates/horizon-world/src/worldgen/feature_graph.rs"
name = "bamboo_grove"
visibility = "pub"
source = "bamboo_grove.rs"

[[injection]]
id = "feature-decode"
kind = "HEAD"
cancellable = true
target = "horizon_world::worldgen::native_feature::decode"
helper = "feature_decode.rs"
bindings = [
 {name="kind", ty="&str", value="kind"},
 {name="json", ty="&str", value="json"},
 {name="bindings", ty="&FeatureBlockBindings<'_>", value="bindings"},
]

[[injection]]
id = "placement-decode"
kind = "HEAD"
cancellable = true
target = "horizon_world::worldgen::placement::decode_native_placement"
helper = "placement_decode.rs"
bindings = [{name="json", ty="&str", value="json"}]

[[injection]]
id = "surface-noises"
kind = "HEAD"
target = "horizon_world::worldgen::overrides::WorldgenOverrides::apply"
helper = "noises.rs"
bindings = [
 {name="overrides",ty="&WorldgenOverrides",value="self"},
 {name="bundle",ty="&str",value="bundle"},
 {name="base",ty="&mut BTreeMap<String,String>",value="&mut base"},
]

[[injection]]
id = "current-vanilla-feature-order"
kind = "HEAD"
target = "horizon_world::worldgen::overrides::WorldgenOverrides::apply"
helper = "biome_order.rs"
bindings = [
 {name="overrides",ty="&WorldgenOverrides",value="self"},
 {name="bundle",ty="&str",value="bundle"},
 {name="base",ty="&mut BTreeMap<String,String>",value="&mut base"},
]

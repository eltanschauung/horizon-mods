id = "horizon_multiplayer_sleep"
name = "Horizon Multiplayer Sleep"
version = "0.2.0"
description = "Skip the night when at least 33% of eligible players sleep."
authors = ["eltanschauung"]
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "4044a6091e78a11c574031ef6b53f01b2654a00c"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.mixin]]
id = "apply"
target = "horizon_client::game::lan_actions::sleep::Game<'_>::sleepers_needed"
kind = "HEAD"
cancellable = true
helper = "src/mixins/threshold.rs"
bindings = [{ name = "active", ty = "i64", value = "active" }]

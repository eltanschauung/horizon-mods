[mod]
id="firstpersonmodel_horizon"
version="0.2.4"
priority=120

[[module]]
id="body"
file="crates/horizon-client/src/game.rs"
name="firstpersonmodel"
source="runtime.rs"

[[injection]]
id="visible"
kind="HEAD"
cancellable=true
target="horizon_client::game::perspective::Game<'_>::own_body_in_view"
helper="visible.rs"
bindings=[
 {name="game",ty="&crate::game::Game<'_>",value="&*self"},
]

[[injection]]
id="geometry"
kind="HEAD"
cancellable=true
target="horizon_client::game::perspective::Game<'_>::player_model_geometry"
helper="geometry.rs"
bindings=[
 {name="game",ty="&crate::game::Game<'_>",value="&*self"},
 {name="camera",ty="glam::DVec3",value="camera"},
 {name="alpha",ty="f64",value="alpha"},
 {name="out",ty="&mut Vec<crate::mesher::Vertex>",value="&mut *out"},
]

[[injection]]
id="hands"
kind="HEAD"
cancellable=true
target="horizon_client::game::Game<'_>::hand_geometry"
helper="hands.rs"
bindings=[
 {name="game",ty="&crate::game::Game<'_>",value="&*self"},
]

[[injection]]
id="pose"
kind="RETURN"
target="horizon_client_lib::mobs::anim::setup"
helper="pose.rs"
bindings=[
 {name="_result",ty="()",value="$value"},
 {name="m",ty="&Mob",value="m"},
 {name="p",ty="&mut Poses",value="&mut *p"},
]
[[injection]]
id="list"
kind="HEAD"
target="horizon_client::game::native_hooks::Game<'_>::native_mods"
helper="list.rs"
bindings=[{name="mods",ty="&mut Vec<crate::game::native_hooks::NativeMod>",value="&mut *mods"}]

[[injection]]
id="settings"
kind="HEAD"
target="horizon_client::game::native_hooks::Game<'_>::native_settings"
helper="settings.rs"
bindings=[
 {name="game",ty="&mut crate::game::Game<'_>",value="&mut *self"},
 {name="mod_id",ty="&str",value="mod_id"},
 {name="buttons",ty="&mut Vec<String>",value="&mut *buttons"},
]
[[injection]]
id="click"
kind="HEAD"
target="horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper="click.rs"
bindings=[
 {name="game",ty="&mut crate::game::Game<'_>",value="&mut *self"},
 {name="mod_id",ty="&str",value="mod_id"},
 {name="button",ty="usize",value="button"},
]

[[module]]
id="view_policy"
file="crates/horizon-client/src/client_lib.rs"
name="firstperson_view_policy"
visibility="pub"
source="view_policy.rs"

[[injection]]
id="empty_hand"
kind="HEAD"
target="horizon_client::game::native_hooks::Game<'_>::native_render_hand"
helper="empty_hand.rs"
bindings=[
 {name="game",ty="&crate::game::Game<'_>",value="&*self"},
 {name="stack",ty="Option<&ItemStack>",value="stack"},
 {name="canceled",ty="&mut bool",value="&mut *canceled"},
]

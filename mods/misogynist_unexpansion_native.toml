id = "misogynist_unexpansion_native"
kind = "native-mod"
name = "Minecraft Misogynist Unexpansion"
summary = "The game taken back: the newer mobs out, the original farm animals and their old babies, and recipes for what the removed mobs gave."
description = """
**This mod has two parts, and you need both.** Install this one, the native part, and [Minecraft Misogynist Unexpansion (assets)](https://playhorizon.dev/mods/misogynist_unexpansion), then press Build.

- **Mobs taken out:** dolphins, foxes, sniffers, copper golems, allays, turtles, bees, parrots, husks, strays, polar bears, pandas, camels, llamas, phantoms, frogs, glow squids, striders, camel husks, armadillos, axolotls, happy ghasts, sulfur cubes, nautiluses, trader llamas, zombie nautiluses, bogged, parched, breezes, creakings, tadpoles and goats. Each can be kept again in `removed_mobs.cfg`; nothing else can be removed.
- **No new looks for old mobs:** cows, pigs and chickens only in their original look, wolves only as the original wolf, and every baby the redesign changed (villagers, zombies, piglins, farm animals, wolves, cats, horses and more) drawn the old way.
- **No sculk in new terrain:** sculk patches and loose sculk veins no longer generate; sculk is crafted from dirt and a bottle o' enchanting, with recipes for sculk veins, sensors, catalysts and shriekers, and a bottle o' enchanting from any mob head.
- **No leaf litter, wildflowers or pink petals generate** in new terrain (those already in a world stay); they are crafted instead (leaves; a dandelion and an oxeye daisy; a pink tulip and cherry leaves) or smelted. **Kelp** only in warm, lukewarm and frozen oceans, and crafted from seagrass and bone meal.
- **Powder snow holds you up, slows you, and freezes you after 15 seconds.**
- **Kelp only in warm, lukewarm and frozen oceans** (new terrain).
- **Old animal sounds and plain wolves:** classic sounds only, every wolf the original colour.
- **Enchanting costs half the level asked:** a level 30 enchantment takes 15 levels.
- **Netherite in an anvil:** a diamond item and a netherite ingot, no smithing template.
- **Deepslate digs faster:** only 15% slower than stone, not twice as slow (its ores and cobbled and polished kinds alike).
- **Walk on powder snow** as if you wore leather boots, and **right-click a grown crop** to harvest and replant it.
- **Key Binds search by key:** the Key Binds search finds a binding by the key it is on.
- **The old water:** beta's water textures (with the assets), beta's one blue everywhere (warm and lukewarm oceans a little lighter) and the old dark, thick water fog; each switched in `old_water.cfg`.
- **No Dried Ghast, no Pigstep:** the Dried Ghast has no recipe and drops nothing; a Pigstep disc in any loot is one of C418's original discs instead.
- **Fishing as it was:** treasure anywhere again, not only in open water, and tropical fish 7 times in 100.
- **Recipes for what they gave:** honey (slime, sugar, a bottle), honeycomb (smelted honey), glow ink (ink and glowstone), froglights (a light block ringed with slime), fish eggs (nine tropical fish), fish scales (from tropical fish; turtle scutes and eggs are named fish scales and fish eggs) and a Potion of Dolphin's Grace (crafted).

Native source mod: it runs with your account's permissions, and is pinned to one Horizon revision. No Minecraft code or assets are included."""
authors = ["mxpbxb"]
owners = ["mxpbxb"]
owner_ids = [73505523]
license = "MIT"
source = "https://github.com/mxpbxb/minecraft-misogynist-unexpansion"
icon = "icons/misogynist_unexpansion_native.png"
categories = ["game-mechanics", "mobs"]
tags = ["vanilla", "mobs", "classic"]


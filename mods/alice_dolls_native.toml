changelog = "New dolls: Patchouli, a sniper with one slow, heavy orb at mobs up to 64 blocks off; Yukari, who follows you and fights; and Alice. Dolls fight back at whatever hurts them or you, first at what is attacking them, and go for iron golems that turn on you. A badly hurt doll is defended by the dolls near it and, with you away, carried off by one. A Goliath under half its health hits twice as hard. Russia and Moscow move twice as fast, fetch what is dropped round the doll they follow, and take what your dolls nearby carry. Wakasagi hooks enemies towards her. A Max Doll Point is worth four, and dolls take the points they carry. Dolls keep their first stack of food. The giga quarry starts with a golden pickaxe; a Netherite Horai earns love by the quarry. Yuuka re-tills trampled farmland. Multiplayer: every player sees the dolls' shots, swings and love; dolls obey only the player who placed them. The Gap bauble is gone."

changelog = "Favour is now love. Grand Guignol cooks what is in its inventory. Dolls on your head stay out of your view and keep quiet. At work, a doll eats a piece of food every five minutes. Healing what its owner did earns no love. Point items: right-click gives the stack, sneak-click one. Dolls carrying items place in survival again."


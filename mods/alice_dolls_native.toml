changelog = "New doll: Joon, the trader (a Doll Core ringed with gold and emerald blocks), with a large chest of stock and no armour or baubles. Her own screen has two tabs: Trades (up to twelve villager-style trades, set from your own items) and Send (the players in her dimension). Sent to a player she follows them for 200 seconds, can't be hurt, and offers her trades; what she is paid goes into her stock, and she won't visit the same player again for 300 seconds. Yuuka cuts cactus, sugar cane and bamboo down to their bottom block. Germany chops half as fast again and replants a sapling of the tree's wood. Dolls get their love-level health again, and wear the armour in their armour slots. The Yukari Doll's empty-handed click opens Yukari Gaps' travel screen again. Needs the assets 0.17.0."


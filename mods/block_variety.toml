id = "block_variety"
kind = "mod"
name = "Block Variety (assets)"
summary = "The blocks, textures and recipes of Block Variety. Needs the Block Variety native mod."
description = """
**This is one of the two parts of [Block Variety](https://playhorizon.dev/mods/block_variety_native), and does nothing alone.** Install both: this one, the assets, and the native part.

It holds the 4,629 blocks of Chipped (by Terrarium) and Chisel (by the Chisel team) the 37 frames of Block Carpentry (by PianoManu) and the Item Trash Can of Trash Cans (by SuperMartijn642), with their models, textures, loot, tags and recipes, the chisel and the hammer, used with their creators' permission."""
authors = ["Terrarium (Chipped)", "Chisel team (Chisel)", "PianoManu (Block Carpentry)", "SuperMartijn642 (Trash Cans)", "mxpbxb (Horizon port)"]
owners = ["mxpbxb"]
owner_ids = [73505523]
license = "All Rights Reserved"
source = "https://github.com/mxpbxb/block-variety"
icon = "icons/block_variety.png"
categories = ["decoration", "library"]
tags = ["blocks", "building", "chisel", "assets"]


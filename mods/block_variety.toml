sha256 = "2191fdc0ee5d7ea115e50febd04c5db5114002517989f4151643bdf647903e70"
changelog = "2,720 Chipped 1.18.2 blocks for the vanilla blocks Chipped 1.18.1 gave none to (iron and the other metal blocks, raw ore blocks, logs, stems, leaves, doors, trapdoors, glazed terracotta, deepslate, tuff and more), recoloured to Programmer Art Continuation. Every block is cut in the stonecutter from any block of its group (7,848 recipes), so JEI shows how each is made. Structure Add-on's limestone, marble, andesite and basalt are in the matching groups. Chisel's own stones, its metals and Chipped's wood glass, which have no vanilla block, are crafted from vanilla things. Needs block_variety_native 0.7.0."


id = "thkaguyamod"
kind = "mod"
name = "Touhou Items (assets)"
summary = "The items, blocks, textures and creative tabs of Touhou Items. Needs the Touhou Items native mod."
description = """
**This is one of the two parts of [Touhou Items](https://playhorizon.dev/mods/thkaguyamod_native), and does nothing alone.** Install both: this one, the assets, and the native part.

It holds the items and blocks, their textures, the spell cards' icons, about 190 recipes, the ores' world generation, the sword enchantment tags and the danmaku sheets, from Touhou Items Mod (by kuro-anco), SPELLCARD PLUS and Journey To Gensokyo (by Katrix), and Grimoire of Alice (by Arekkuusu), used with their creators' permission."""
authors = ["kuro-anco (Touhou Items Mod)", "SPELLCARD PLUS authors", "Katrix (Journey To Gensokyo)", "Arekkuusu (Grimoire of Alice)", "mxpbxb (Horizon port)", "Xalcon (Torchmaster's Mega Torch, MIT)"]
owners = ["mxpbxb"]
owner_ids = [73505523]
license = "All Rights Reserved"
source = "https://github.com/mxpbxb/touhou-items"
icon = "icons/thkaguyamod.png"
categories = ["adventure", "library"]
tags = ["touhou", "items", "assets"]


id = "thkaguyamod"
kind = "mod"
name = "Touhou Items (assets)"
summary = "The items, textures and creative tabs of Touhou Items. Needs the Touhou Items native mod."
description = """
**This is one of the two parts of [Touhou Items](https://playhorizon.dev/mods/thkaguyamod_native), and does nothing alone.** Install both: this one, the assets, and the native part.

It holds the 50 items, their textures, the Mochi Hammer's recipe, the sword enchantment tags and the danmaku sheets, from Touhou Items Mod (by kuro-anco) and Grimoire of Alice (by Arekkuusu), used with their creators' permission."""

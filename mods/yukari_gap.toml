id = "yukari_gap"
kind = "mod"
name = "Yukari Gaps Beta (assets)"
summary = "The block, item, art and recipe of Yukari Gaps Beta. Needs the Yukari Gaps Beta native mod."
description = """
**This is one of the two parts of [Yukari Gaps Beta](https://playhorizon.dev/mods/yukari_gap_native), and does nothing alone.** Install both: this one, the assets, and the native part.

It holds the gap block, its item, the eye-gap picture and the recipe. It has no code: what the mod does is described on Yukari Gaps Beta.

The gap's picture and bows are from pipef0x's Yukari Gap Demo (MIT); the gap item's icon is Touhou Little Maid's wireless IO art by TartaricAcid and others (CC BY-NC-SA 4.0), by way of Alice Dolls Restringed; the rest is by mxpbxb (MIT). No Minecraft assets are included."""
authors = ["mxpbxb", "pipef0x", "TartaricAcid"]
owners = ["mxpbxb"]
owner_ids = [73505523]
license = "MIT AND CC-BY-NC-SA-4.0"
source = "https://github.com/mxpbxb/yukari-gaps"
icon = "icons/yukari_gap.png"
categories = ["transportation", "library"]
tags = ["teleport", "waypoints", "touhou", "assets"]


id = "biomesoplenty"
kind = "mod"
name = "Biomes O' Plenty (old textures)"
summary = "Horizon's Biomes O' Plenty with 135 of its textures back to Biomes O' Plenty 1.12's."
description = """
Horizon's Biomes O' Plenty port (0.2.7) with the old look: 135 textures back to Biomes O' Plenty 1.12's, for the woods, leaves, saplings, doors, flowers, grasses and sands.

**It is the whole BOP mod, in place of the one that comes with Horizon**, not an add-on: a content mod can only change its own namespace's files. The blocks, items, biomes and worlds are the same. Clover, the blood fluid, boats and everything added to BOP after 1.12 keep their 26.3 textures.

Biomes O' Plenty by Adubbz, Amnet, Cheeserolls, Forstride and ted80 (CC BY-NC-ND 4.0), used with permission."""

id = "torchmaster"
kind = "mod"
name = "Torchmaster (assets)"
summary = "The blocks, art, names and recipe of Torchmaster. Needs the Torchmaster native mod."
description = """
**This is one of the two parts of [Torchmaster](https://playhorizon.dev/mods/torchmaster_native), and does nothing alone.** Install both: this one, the assets, and the native part.

It holds the Mega Torch block and item, its art, names, loot and recipe. It has no code: what the mod does is described on Torchmaster.

The art and names are from [Torchmaster](https://github.com/Xalcon/TorchMaster) by Xalcon, MIT licensed. No Minecraft assets are included."""
authors = ["Xalcon (Torchmaster)", "mxpbxb (Horizon port)"]

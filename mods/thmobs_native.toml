changelog = "Classic bosses: eleven named characters also come as a Classic version that fights as the original mods had it, at full rate of fire, through every stage and with every spell card they declared, lasers included. A classic boss has all its stages in one health bar, like the Wither: each stage's worth of health lost breaks its spell card and starts the next. Once in 20,000 one spawns in place of its counterpart, and each has a spawn egg. Yukari Great Doll (classic Yukari with a quarter of the health and half the danmaku damage) comes through gaps made global with a Yukari umbrella, and always drops an umbrella; Yukari drops one 70 times in 100. Touhou mobs no longer drink the wandering trader's potions and milk. Needs the assets mod 0.9.0."


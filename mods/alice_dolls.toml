id = "alice_dolls"
kind = "mod"
name = "Alice Dolls Restringed (assets)"
summary = "The doll items, recipes and art of Alice Dolls Restringed. Needs the Alice Dolls Restringed native mod."
description = """
**This is one of the two parts of [Alice Dolls Restringed](https://playhorizon.dev/mods/alice_dolls_native), and does nothing alone.** Install both: this one, the assets, and the native part.

It holds the doll items, the Doll Core, the baubles, their recipes, names, sounds and textures, from Alice's Dolls (by iwa_yukinoshita), used with permission, and mxpbxb's Yukari, Patchouli and Alice dolls. The doll bell, doll anchor and bauble art is Touhou Little Maid's, by TartaricAcid and others, under CC BY-NC-SA 4.0."""
authors = ["iwa_yukinoshita (Alice's Dolls)", "TartaricAcid and others (Touhou Little Maid art)", "mxpbxb (Horizon port)"]
owners = ["mxpbxb"]

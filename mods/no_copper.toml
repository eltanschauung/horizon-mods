id="no_copper"
kind="native-mod"
name="No Copper"
summary="Disables copper ore deposits and large copper veins on the world host."
description="""
Disables copper and deepslate copper ore deposits, including large copper veins and their raw-copper blocks.
Other ores stay unchanged. Runs after worldgen overrides, including Tectonic and data packs.
Only the world host needs the mod. Includes a separate offline copper-to-coal conversion tool in the source repository.
"""
